      - { date: 2026-10-12, text: 'DÉCISION LEAD 12-10 (2e rendu « maquette non conforme », vague 2026-10-12-1100, majeur : bouton « Supprimer la vidéo » dans le lien de carte = interactif imbriqué). Schéma retenu = lien étiré : la carte reste un <article> ; le lien <a href="/videos?video=<id>"> porte le titre et couvre toute la carte par un ::after (position absolue) ; le bouton Supprimer est un FRÈRE du lien, au-dessus (position relative + z-index), ordre de tabulation lien puis bouton ; focus visible sur le lien (contour de la carte via :focus-within ou le ::after). R6 retourne le focus sur le lien. Fiche (règle sourcée : HTML interactive content + WCAG 2.1.1, décision lead), maquette et test. Les 6 mineurs en notes.' }
