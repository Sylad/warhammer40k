# Fichiers dérivés du plan : un commit qui ne touche que le plan et ceux-ci est de
# l'entretien du plan (pas de lot à citer, ne compte pour aucun lot).
plan:
  files: [frontend/public/plan-data/plan.json, frontend/public/nouveautes-data/nouveautes.json]
  # Le plan publié est régénéré à chaque écriture du plan (cadence plan.onWrite) : sans lui, un raf ux/done
  # du lead laissait plan.json en retard et la CI « Plan publié à jour » rougissait (livraison de L200, 27-10).
  onWrite: { command: cd frontend && npm run plan, files: [frontend/public/plan-data/plan.json] }
# Livraison par `cadence deliver` (https://github.com/Sylad/cadence) :
# CI du sha poussé → bump du tag dans developpeur-gitops → vérification de l'effet.
deliver:
  ci: github
  deploy:
    - ./scripts/deploy.sh
  verify:
    - command: ./scripts/verify-rollout.sh
    - url: https://warhammer.sladoire.dev/api/health
      contains: '"status":"ok"'
    - url: https://warhammer.sladoire.dev/
    # ce que reçoit un visiteur revenu après une livraison : le document en no-cache
    # (sinon l'ancienne appli reste affichée — 1 h 25 mesurée le 03-10 sur une appli
    # sœur), son script principal servi en JavaScript, et 404, pas le repli HTML,
    # pour un script absent
    - command: ./scripts/verify-cache.sh
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate) : backend NestJS (3001) + frontend Angular (4201)
# dans UN groupe de processus, tués ensemble par le programme.
orchestrate:
  # Escalade (L204, cadence L337 / 1.12.0) : avant de rendre un lot encore non conforme après ses passes, la vague joue
  # une correction et une revue neuve en Fable (règle du lead depuis le 17-10, oubliée deux fois à la main).
  escalation: { model: fable }
  # Précheck coupé le 28-10 (L210) : cadence perf du 22 au 28-10 = 1 « oui » sur 236 lots, 4,9 M tokens Sonnet
  # pour ≈ 80 k évités ; des lots bien découpés n'ont plus rien à retrouver. Revenir à true si une vague refait un lot déjà fait.
  precheck: false
  # Porte de tests de la vague (L203), lancée après chaque implement/fix : la CI « Contrôles frontend » a été rouge
  # 4 fois du 18 au 23-10 faute que la vague lance la suite. Commandes vérifiées vertes sur main le 25-10 :
  # backend 121 tests, frontend 1041 tests. Les `*.e2e.spec.ts` (Chromium + dist) sont exclus : sous la charge de
  # la suite complète l'un d'eux a expiré (section-anchor-href-l160), ils tournent en CI (`npm run test:e2e`).
  # Les acceptations rouges (vert: false) restent exclues par vitest.config.ts et ne passent que par `accept:`.
  test: (cd backend && npm test) && (cd frontend && npx vitest run --exclude '**/*.e2e.spec.ts')
  # Build backend (nest build) puis frontend (ng build + contrôle de fuite du plan), verts le 25-10.
  build: (cd backend && npm run build) && (cd frontend && npm run build)
  ux:
    command: '(cd backend && npm run start:dev) & (cd frontend && npm start) & wait'
    url: http://localhost:4201
    timeout: 300
  # Étape spec d'un lot à écran (screen:) : fiche + maquette sous docs/specs/<écran>/, revue de maquette,
  # puis tests d'acceptation rouges lancés par la commande dédiée ci-dessous (lanceur dans frontend/).
  spec: { dir: docs/specs }
  accept: cd frontend && npx vitest run -c vitest.acceptation.config.ts

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # API NestJS (units, factions, images, lore-feed…) : « Modules backend / endpoints clés » du CLAUDE.md et « Fonctionnalités » du README. Les données `backend/seed/` sont du contenu, hors règle.
    - paths: ['backend/src/**', '!backend/src/__test-utils__/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md]
    # Écrans Angular (features, layout, shared, routes) : « Frontend features (12 pages) » du CLAUDE.md, « Fonctionnalités » du README ; une Nouveauté vaut pour un changement visible. SCSS et tests exclus.
    - paths: ['frontend/src/**', '!**/*.scss', '!**/*.css', '!frontend/src/testing/**', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, 'docs/nouveautes/*.md']
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/warhammer40k.astro
