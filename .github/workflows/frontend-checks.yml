name: Contrôles frontend

# L30 : rend le run ROUGE si le plan publié (frontend/public/plan-data/plan.json)
# n'est plus à jour avec .cadence/raf.yaml — cas typique : un commit qui ne
# touche que le plan (`raf done`) sans `npm run plan` —, si un test Vitest échoue,
# ou si un texte privé du plan (note, verdict UX, titre brut) se retrouve dans
# l'application construite (npm run build se termine par plan-data.mjs --leaks ;
# ici docs/ est présent, contrairement au build Docker dont le contexte est frontend/).
#
# Workflow séparé de build.yml : il ne conditionne pas les images et n'est pas lu
# par deploy.sh (qui ne regarde que build.yml). cadence deliver attend en revanche
# tous les runs du sha livré : un plan périmé bloque donc sa livraison.
# Pas de filtre `paths` : un commit de plan seul doit être contrôlé.
# Repris d'ol-companion L23.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Plan publié, tests et build frontend
    runs-on: ubuntu-latest
    # L245 : le job (alors unique) a dû passer de 10 à 35 min à cause des e2e. L256 : les e2e sont sortis dans le job
    # `e2e` ci-dessous, qui tourne en parallèle de celui-ci. Ici : Vitest 46 s, build 14 s (local, 22-11), nginx < 1 min.
    # Le job vaut au moins la somme des timeouts d'étape (8 + 5 + 3 = 16) : une étape trop longue échoue sur son nom,
    # le job n'est jamais annulé au milieu d'une étape. Garde : ci-frontend-checks.test.mjs.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Plan publié à jour (sinon cd frontend && npm run plan, puis commiter plan.json)
        run: node scripts/plan-data.mjs --check

      - name: Tests Vitest
        timeout-minutes: 8
        run: npx vitest run

      - name: Build (avec vérification de fuite du plan)
        timeout-minutes: 5
        run: npm run build

      # L52 : nginx.conf sur un vrai nginx (Docker, présent sur ubuntu-latest) : en-têtes de cache
      # d'index.html, des fichiers à empreinte, des absents (404 no-store), des plages d'octets.
      # Sert frontend/dist, d'où sa place après le build ; le script se place lui-même à la racine.
      - name: nginx.conf, en-têtes de cache sur un vrai nginx
        working-directory: .
        timeout-minutes: 3
        run: scripts/test-nginx-cache.sh

  # L256 : les e2e ont dépassé les 12 min de leur étape sur 05480b1 (run 45415489011, aucun test rouge ; 11 min avant L253,
  # runs 45352842388 et 45350768906). Mesure du 24-11 (npm run test:e2e entier, junit, Big-Blue chargé) : 924 s, dont 223 s
  # pour les deux fichiers de L253 ; le runner donnait des durées voisines (11 min pour 701 s mesurées ici sans L253).
  # Partagés en deux jobs parallèles, chacun sur son runner (un fichier à la fois sur chacun, L166) : partage par durées
  # mesurées (scripts/e2e-durees.json, moyenne de deux mesures, plus long d'abord, scripts/e2e-parties.mjs) → 489 s et
  # 487 s (~8 min), et non `vitest --shard`, qui découpe par empreinte du chemin (574 s contre 350 s sur la même mesure).
  # CI attendue ~11 min de bout en bout (npm ci, build, Chromium, puis ~8 min d'e2e), en parallèle du job de contrôles.
  e2e:
    name: Acceptation de bout en bout, partie ${{ matrix.partie }}/2
    runs-on: ubuntu-latest
    strategy:
      # les deux parties vont au bout : un rouge dans l'une n'annule pas l'autre (chaque artefact e2e-junit reste).
      fail-fast: false
      matrix:
        partie: [1, 2]
    # Somme des timeouts d'étape d'un même passage : build 5 + Chromium 5 (l'une ou l'autre installation) + e2e 15 = 25.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      # Les e2e servent l'application construite (dist) : chaque runner la construit (~14 s en local).
      - name: Build de l'application servie aux e2e
        timeout-minutes: 5
        run: npm run build

      # L188 : `install --with-deps chromium` se bloquait (téléchargement + apt) jusqu'au timeout du job.
      # Le navigateur (~/.cache/ms-playwright) est mis en cache, clé sur la version de playwright-core ;
      # les dépendances système (apt) restent hors cache : à cache trouvé, `install-deps` seul.
      - name: Version de playwright-core (clé du cache de Chromium)
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # L192 : restore + save séparés. `actions/cache@v4` n'enregistre qu'en fin de job RÉUSSI : un e2e
      # rouge au premier run (sans cache) empêchait tout enregistrement et chaque run réinstallait.
      - name: Cache de Chromium
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-core-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Chromium pour l'acceptation de bout en bout, sans cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          SECONDS=0
          npx playwright-core install --with-deps chromium
          echo "Chromium installé sans cache en ${SECONDS} s"

      - name: Enregistrement du cache de Chromium (tout de suite, avant les e2e)
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-core-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Dépendances système de Chromium (Chromium en cache)
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: |
          SECONDS=0
          npx playwright-core install-deps chromium
          echo "Dépendances système installées, Chromium en cache, en ${SECONDS} s"

      # L166 : durée de chaque cas (junit), charge du runner et journal horodaté de chaque appel Playwright
      # (DEBUG=pw:api : clic, onglet ouvert, waitForEvent) conservés, échec compris, pour qu'un rouge
      # aléatoire qui revient laisse de quoi distinguer clic manqué, onglet absent et onglet en retard.
      # L256 : partie la plus longue estimée à 489 s (~8,2 min) d'après scripts/e2e-durees.json ; 15 min = ×1,84. La
      # même partie a pris 666 s de cas sur Big-Blue à une charge de 78 sur 32 cœurs : 15 min en gardent encore ×1,35.
      # ci-frontend-checks.test.mjs recalcule ce rapport depuis la table : un nouvel e2e qui le fait passer sous ×1,5 rend
      # le test rouge → relever ce délai ou passer à trois parties (matrice et E2E_PARTIE ensemble). Durées réelles de
      # chaque partie : artefacts e2e-junit-<partie>, à reporter dans la table.
      - name: Acceptation de bout en bout (application construite, Chromium)
        timeout-minutes: 15
        shell: bash
        env:
          E2E_PARTIE: ${{ matrix.partie }}/2
        run: |
          nproc; uptime
          # charge échantillonnée toutes les 2 s pendant les e2e : l'uptime d'avant le lancement ne mesure que le build
          while true; do echo "$(date +%T) $(cat /proc/loadavg)" >> e2e-charge.log; sleep 2; done &
          sampler=$!
          trap 'kill $sampler 2>/dev/null' EXIT
          DEBUG=pw:api npm run test:e2e -- --reporter=default --reporter=junit --outputFile.junit=e2e-junit.xml 2>&1 | tee e2e-pwapi.log

      - name: Durées des cas e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-${{ matrix.partie }}
          path: |
            frontend/e2e-junit.xml
            frontend/e2e-pwapi.log
            frontend/e2e-charge.log
          if-no-files-found: ignore
