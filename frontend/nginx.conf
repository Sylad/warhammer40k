# La politique de sécurité de contenu, posée sur toutes les réponses. Elle a un
# nom (L51) parce qu'un `add_header` écrit dans un `location` annule tous ceux
# hérités du bloc `server` : chaque location qui pose un Cache-Control la repose.
map "" $wh_csp {
    default "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.youtube.com https://i.ytimg.com; frame-src https://www.youtube.com;";
}

# L51 : le build Angular (outputHashing: all) met une empreinte de contenu de
# 8 caractères dans le nom de ce qu'il produit — main-, polyfills-, chunk-,
# styles- à la racine, images des feuilles de style dans media/. Ce qui est
# copié tel quel de public/ (favicon.svg, galaxy-map.jpg, nouveautes-data/,
# plan-data/) garde le même nom d'une livraison à l'autre.
map $uri $wh_empreinte {
    "~^/(?:media/)?[^/]+-[A-Z0-9]{8}\.[a-z0-9]+$" 1;
    default                                       0;
}

# L51 : Cache-Control d'un fichier statique, selon le statut de la réponse.
# Servi (200, 206, 304) avec une empreinte dans le nom : cache d'un an, jamais
# revalidé. Servi sans empreinte : gardé mais revalidé à chaque visite. Toute
# autre réponse (404 d'un fichier absent surtout) ne doit être gardée par
# personne — ni le navigateur ni Cloudflare, qui sinon met en cache la réponse
# d'un nom en .js / .css.
map "$status:$wh_empreinte" $wh_fichier_cache_control {
    "~^(?:200|206|304):1$" "public, max-age=31536000, immutable";
    "~^(?:200|206|304):0$" "no-cache";
    default                "no-store";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy $wh_csp always;

    # `^~` : un chemin d'API qui finit par .jpg ou .js (images de la galerie)
    # reste relayé au backend au lieu d'être pris par le bloc des fichiers
    # statiques ci-dessous. Aucun Cache-Control ajouté ici : celui du backend passe.
    location ^~ /api/ {
        proxy_pass http://warhammer-backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # L51 : scripts, feuilles de style, polices, images et JSON. Un nom absent
    # répond 404, jamais le repli index.html : un navigateur resté sur un ancien
    # index.html demande d'anciens chunks, et recevoir du HTML à leur place
    # casse la page (« Failed to load module script… MIME type of text/html »).
    # Aucune route de l'application ne finit par une de ces extensions.
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Content-Security-Policy $wh_csp always;
        add_header Cache-Control $wh_fichier_cache_control always;
    }

    # L51 : tout le reste — index.html (/, /index.html, repli des routes).
    # `no-cache` = gardé mais revalidé à chaque visite (ETag / Last-Modified →
    # 304) ; sans cet en-tête, le navigateur gardait l'ancien index.html par
    # fraîcheur heuristique après une livraison.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $wh_csp always;
        add_header Cache-Control "no-cache";
    }
}
